name: Release desktop (Windows)
# Crie uma tag (ex.: git tag v0.1.0 && git push origin v0.1.0) para compilar e publicar o instalador.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Chave privada do auto-update (secret) — gerada com `tauri signer generate`
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Valores PÚBLICOS embutidos no app (podem ser secrets ou variables)
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_APP_URL: ${{ secrets.VITE_PUBLIC_APP_URL }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Vibe Chat ${{ github.ref_name }}"
          releaseBody: "Instalador para Windows. O Windows pode mostrar o aviso do SmartScreen (instalador não assinado): clique em “Mais informações” → “Executar assim mesmo”."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

  # macOS (.dmg universal). EXPERIMENTAL: sem assinatura/notarização da Apple o Gatekeeper bloqueia o primeiro abrir
  # (clique direito > Abrir). Se este job falhar, o instalador do Windows e o restante da release NÃO são afetados.
  macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_APP_URL: ${{ secrets.VITE_PUBLIC_APP_URL }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Vibe Chat ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: --target universal-apple-darwin --bundles dmg
