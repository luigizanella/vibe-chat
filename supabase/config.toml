# Configuração para o Supabase CLI (supabase start / supabase db push / functions deploy).
# Em projetos hospedados, as opções de Auth são configuradas no painel (ver docs/SETUP.md).
project_id = "vibe-chat"

[api]
enabled = true
schemas = ["public", "graphql_public"]   # "private" NÃO é exposto de propósito
max_rows = 1000

[db]
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "tauri://localhost/**", "http://tauri.localhost/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false  # ligue em produção se tiver SMTP configurado

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "25MiB"

[functions.livekit-token]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
